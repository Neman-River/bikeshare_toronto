<p>The shape barely changes year to year, even as 2024-2026 saw steady growth. Every year traces almost the same curve — a spring climb, a summer plateau, a winter drop-off — just larger each time.</p>
<p>2026 (still in progress) is <span class="highlight">grayed out</span> because it's incomplete, not because ridership actually fell.</p>
